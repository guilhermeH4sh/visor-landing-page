<div id="visor-app-root" aria-live="polite">
  <div id="visor-overlay" class="visor-overlay" aria-hidden="true"></div>

  <div id="visor-toast-stack" class="visor-toast-stack"></div>

  <div id="visor-search" class="visor-search-bar" role="search" aria-hidden="true">
    <div style="position:relative;max-width:640px;margin:0 auto">
      <button type="button" class="visor-close" id="visor-search-close" aria-label="Fechar busca" style="position:absolute;right:0.5rem;top:50%;transform:translateY(-50%);z-index:2">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <input id="visor-search-input" type="search" placeholder="Buscar óculos, armações, coleção Horizonte…" autocomplete="off" aria-label="Buscar produtos"/>
    </div>
  </div>
  <div id="visor-search-results" class="visor-search-results" aria-hidden="true"></div>

  <nav id="visor-mobile-nav" class="visor-mobile-nav" aria-hidden="true" aria-label="Menu mobile">
    <a href="#colecao">Óculos de Sol</a>
    <a href="#colecao">Grau</a>
    <a href="#atelie">Ateliê</a>
    <a href="#social">Instagram</a>
    <a href="#topo">Início</a>
  </nav>

  <aside id="visor-cart" class="visor-panel" aria-hidden="true" aria-label="Sacola">
    <div class="visor-panel__head">
      <h2 class="visor-panel__title">Sacola</h2>
      <button type="button" class="visor-close" data-close="visor-cart" aria-label="Fechar sacola">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="visor-panel__body" id="visor-cart-list"></div>
    <div class="visor-panel__foot">
      <p id="visor-shipping-note" class="visor-shipping-note"></p>
      <div class="visor-total-row"><span>Subtotal</span><span id="visor-cart-subtotal">R$ 0,00</span></div>
      <div class="visor-total-row"><span>Frete</span><span id="visor-cart-shipping">—</span></div>
      <div class="visor-total-row"><strong>Total</strong><strong id="visor-cart-total">R$ 0,00</strong></div>
      <button type="button" class="visor-btn visor-btn--primary" id="visor-checkout">Finalizar pedido</button>
    </div>
  </aside>

  <aside id="visor-favorites" class="visor-panel" aria-hidden="true" aria-label="Favoritos">
    <div class="visor-panel__head">
      <h2 class="visor-panel__title">Favoritos</h2>
      <button type="button" class="visor-close" data-close="visor-favorites" aria-label="Fechar favoritos">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="visor-panel__body" id="visor-favorites-list"></div>
  </aside>

  <aside id="visor-account" class="visor-panel" aria-hidden="true" aria-label="Conta">
    <div class="visor-panel__head">
      <h2 class="visor-panel__title">Minha conta</h2>
      <button type="button" class="visor-close" data-close="visor-account" aria-label="Fechar conta">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="visor-panel__body" id="visor-account-body"></div>
  </aside>

  <div id="visor-quickview" class="visor-modal" aria-hidden="true" role="dialog" aria-label="Visualização rápida">
    <div class="visor-modal__card">
      <button type="button" class="visor-close" id="visor-quickview-close" aria-label="Fechar visualização" style="position:absolute;top:1rem;right:1rem;z-index:2;background:#fff">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <div id="visor-quickview-content"></div>
    </div>
  </div>

  <div id="visor-cookie" class="visor-cookie" role="dialog" aria-label="Cookies">
    <div class="visor-cookie__inner">
      <p>Utilizamos cookies para melhorar sua experiência e medir o desempenho da loja. Você pode aceitar todos ou apenas os essenciais.</p>
      <div class="visor-cookie__actions">
        <button type="button" class="visor-btn visor-btn--ghost" data-action="essential">Só essenciais</button>
        <button type="button" class="visor-btn visor-btn--primary" data-action="accept" style="width:auto">Aceitar todos</button>
      </div>
    </div>
  </div>

  <a id="visor-whatsapp" class="visor-whatsapp" href="#" aria-label="Falar no WhatsApp">

</div>
